[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baleropy"
dynamic = ["version"]
description = "Modern, fully-typed, asynchronous framework for the Bale Bot API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Reza Mardani" }]
keywords = ["bale", "bale-bot", "bot", "api", "asyncio", "framework", "aiogram", "pydantic", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["aiohttp>=3.9", "pydantic>=2.7,<3"]

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aresponses>=3", "ruff>=0.5", "mypy>=1.10", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/rezamardani01/Baleropy"
Documentation = "https://rezamardani01.github.io/baleropy-docs/"
Source = "https://github.com/rezamardani01/Baleropy"
Issues = "https://github.com/rezamardani01/Baleropy/issues"
Changelog = "https://github.com/rezamardani01/Baleropy/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "baleropy/__meta__.py"

[tool.hatch.build.targets.wheel]
packages = ["baleropy"]

[tool.hatch.build.targets.sdist]
include = ["/baleropy", "/tests", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
implicit_reexport = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
