name: Publish to PyPI

# Publishes with PyPI "Trusted Publishing" (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org: Account -> Publishing -> add a pending publisher
#   project: balegram-api | owner: rezamardani01 | repo: balegram
#   workflow: publish.yml | environment: pypi
# Then create a GitHub Release (tag v<version>) to publish.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import re,pathlib;print(re.search(r'\"(.+?)\"', pathlib.Path('balegram/__meta__.py').read_text()).group(1))")
          test "v$VERSION" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} != v$VERSION"; exit 1; }
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
